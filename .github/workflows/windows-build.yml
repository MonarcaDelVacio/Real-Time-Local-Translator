name: Windows build

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, experimental/sherpa-streaming-0.4, experimental/sherpa-quality-0.4.1]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          py -3.11 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements\dev.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Build application
        shell: pwsh
        run: .\build\build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force redist | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "redist\\vc_redist.x64.exe"

      - name: Verify Microsoft Visual C++ runtime signature
        shell: pwsh
        run: |
          $runtime = Join-Path $env:GITHUB_WORKSPACE "redist\\vc_redist.x64.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime
          if ($signature.Status -ne "Valid") {
            throw "Microsoft Visual C++ runtime signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            throw "Unexpected signer for Microsoft Visual C++ runtime: $($signature.SignerCertificate.Subject)"
          }
          Write-Host "Verified Microsoft-signed Visual C++ runtime."

      - name: Build installer
        shell: pwsh
        run: |
          $installerOutput = Join-Path $env:GITHUB_WORKSPACE "dist\installer"
          New-Item -ItemType Directory -Force $installerOutput | Out-Null
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "installer\RealTimeLocalTranslator.iss"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/O$installerOutput" $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = Get-ChildItem -Path $installerOutput -Filter "*.exe" -File
          if (-not $setup) {
            throw "Inno Setup completed without producing an installer in $installerOutput"
          }
          foreach ($file in $setup) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($file.FullName + ".sha256") -Value "$hash  $($file.Name)" -Encoding ascii
            Write-Host "SHA-256 $($file.Name): $hash"
          }

      - name: Record build dependency versions
        shell: pwsh
        run: |
          $packages = & .\.venv\Scripts\python.exe -m pip freeze
          if ($LASTEXITCODE -ne 0) {
            throw "Could not record the Python build environment."
          }
          $packages | Set-Content -LiteralPath "dist\installer\build-dependencies.txt" -Encoding utf8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RealTimeLocalTranslator-Windows
          path: |
            dist\installer\*.exe
            dist\installer\*.sha256
            dist\installer\build-dependencies.txt
          if-no-files-found: error
          retention-days: 14
