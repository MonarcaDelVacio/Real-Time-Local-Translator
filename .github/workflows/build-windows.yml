name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Prepare local AI models
        run: python scripts/prepare_local_models.py
      - name: Build Windows application
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build/build_windows.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/RealTimeLocalTranslator.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
      - name: Package portable build
        shell: powershell
        run: Compress-Archive -Path dist/RealTimeLocalTranslator/* -DestinationPath dist/RealTimeLocalTranslator-0.3.0-portable.zip
      - name: Package source
        shell: powershell
        run: Compress-Archive -Path app,config,engines,requirements,scripts,docs,main.py,pyproject.toml,README.md,LICENSE -DestinationPath dist/RealTimeLocalTranslator-0.3.0-source.zip
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: RealTimeLocalTranslator-0.3.0-Windows
          path: |
            dist/installer/*.exe
            dist/RealTimeLocalTranslator-0.3.0-portable.zip
            dist/RealTimeLocalTranslator-0.3.0-source.zip
          if-no-files-found: error
