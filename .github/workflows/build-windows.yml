name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --name RealTimeLocalTranslator --windowed main.py

      - name: Package source
        shell: powershell
        run: Compress-Archive -Path app,config,engines,requirements,scripts,docs,main.py,pyproject.toml,README.md,LICENSE -DestinationPath RealTimeLocalTranslator-source.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealTimeLocalTranslator-Windows
          path: |
            dist/RealTimeLocalTranslator/**
            RealTimeLocalTranslator-source.zip
